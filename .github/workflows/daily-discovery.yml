name: Daily AI+CAD discovery

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD); empty uses the rolling daily window"
        required: false
        type: string
      to_date:
        description: "End date (YYYY-MM-DD); empty uses today"
        required: false
        type: string
      search_days:
        description: "Rolling window in days when from_date is empty"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: ai-cad-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover candidate papers
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: |
          args=(--config config/ai-cad.json --output data/latest.json --archive-dir data/archive)
          if [ -n "${{ inputs.from_date }}" ]; then args+=(--from-date "${{ inputs.from_date }}"); fi
          if [ -n "${{ inputs.to_date }}" ]; then args+=(--to-date "${{ inputs.to_date }}"); fi
          if [ -n "${{ inputs.search_days }}" ]; then args+=(--search-days "${{ inputs.search_days }}"); fi
          python scripts/discover.py "${args[@]}"
      - name: Validate feed
        run: python scripts/validate_feed.py data/latest.json
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/manifest.json data/archive/
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: daily discovery $(date -u +%F)"
            git push
          fi
